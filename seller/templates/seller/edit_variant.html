{% extends "customers/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'seller/seller.css' %}">
{% endblock %}

{% block content %}

<div class="wrapper">

    {% include "seller/sidebar.html" %}

    <div class="main">

        <div class="topbar">
            <h1>Edit Variant - {{ variant.product.name }}</h1>
        </div>

        <div class="form-box">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Attributes</label>
                    <div class="variant-attributes">
                        {{ form.attributes }}
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>
                    {{ form.price }}
                </div>

                <div class="mb-3">
                    <label class="form-label">Stock</label>
                    {{ form.stock }}
                </div>

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">
                        Update Variant
                    </button>

                    <a href="{% url 'seller:manage_variants' variant.product.id %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
