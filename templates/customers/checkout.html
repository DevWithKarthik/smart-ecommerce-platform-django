{% extends 'customers/base.html' %}

{% block content %}
<div class="container mt-5">

  <h2>Checkout</h2>

  <div class="row mt-4">

    <!-- LEFT: ADDRESS FORM -->
    <div class="col-md-6">
      <form method="post">
        {% csrf_token %}

        <input type="text" name="full_name" class="form-control mb-3" placeholder="Full Name" required>
        <input type="text" name="phone" class="form-control mb-3" placeholder="Phone Number" required>
        <textarea name="address" class="form-control mb-3" placeholder="Address" required></textarea>
        <input type="text" name="city" class="form-control mb-3" placeholder="City" required>
        <input type="text" name="state" class="form-control mb-3" placeholder="State" required>
        <input type="text" name="pincode" class="form-control mb-3" placeholder="Pincode" required>

        <button type="submit" class="btn btn-dark w-100">
          Place Order
        </button>

      </form>
    </div>

    <!-- RIGHT: ORDER SUMMARY -->
    <div class="col-md-6">
      <h5>Order Summary</h5>
      <hr>

      {% for variant_id, item in cart_items %}
        <div class="d-flex justify-content-between mb-2">
          <span>{{ item.product_name }} (x{{ item.quantity }})</span>
          <span>₹{{ item.total_price }}</span>
        </div>
      {% endfor %}

      <hr>
      <h5 class="text-end">Total: ₹{{ total }}</h5>
    </div>

  </div>

</div>
{% endblock %}
