{% extends "customers/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/product_list.css' %}?v=2">
{% endblock %}

{% block content %}
<section class="shop-page">

    <div class="shop-header">
        <h1>Explore Products</h1>
        <p>Discover premium tech crafted for the future.</p>
    </div>

    <div class="product-grid">
        {% for product in products %}
        <div class="product-card">

            <div class="product-image">
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
                <div class="overlay">
                    <a href="{% url 'prodcuts:product_detail' product.id %}" class="view-btn">
                        View Details
                    </a>
                </div>
            </div>

            <div class="product-info">
                <h3>{{ product.name }}</h3>
                <p class="price">₹ {{ product.base_price }}</p>
            </div>

        </div>
        {% endfor %}
    </div>

</section>
{% endblock %}
