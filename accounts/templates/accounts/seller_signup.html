{% extends 'customers/base.html' %}

{% block content %}
  <div class="container mt-5" style="max-width:420px;">
    <h2>Seller Registration</h2>

    <form method="POST">
      {% csrf_token %}

      <input type="text" name="username" class="form-control mb-3" placeholder="Username" required />

      <input type="email" name="email" class="form-control mb-3" placeholder="Email" required />

      <input type="password" name="password" class="form-control mb-3" placeholder="Password" required />

      <input type="text" name="business_name" class="form-control mb-3" placeholder="Business Name" required />

      <input type="text" name="gst_number" class="form-control mb-3" placeholder="GST Number" required />

      <textarea name="address" class="form-control mb-4" placeholder="Business Address"></textarea>

      <button type="submit">Register Seller</button>
    </form>

    <p>Your account will be activated after admin approval.</p>
  </div>
{% endblock %}
