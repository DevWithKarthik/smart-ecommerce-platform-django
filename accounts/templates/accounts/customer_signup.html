{% extends 'customers/base.html' %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="sc-page">
<div class="auth-page">
  <div class="auth-card sc-reveal">

    <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
    <h1 class="auth-title">Create Customer Account</h1>
    <p class="auth-subtitle">Join SmartCart to start shopping.</p>

    <form method="POST">
      {% csrf_token %}

      <div class="sc-field">
        <label class="sc-label" for="csUsername">Username</label>
        <input type="text" id="csUsername" name="username" class="sc-input" placeholder="Choose a username" required autofocus>
      </div>

      <div class="sc-field">
        <label class="sc-label" for="csEmail">Email</label>
        <input type="email" id="csEmail" name="email" class="sc-input" placeholder="you@example.com" required>
      </div>

      <div class="sc-field">
        <label class="sc-label" for="csPassword">Password</label>
        <input type="password" id="csPassword" name="password" class="sc-input" placeholder="Create a password" required>
      </div>

      <button type="submit" class="sc-btn sc-btn-primary sc-btn-block" data-ripple>Create Account</button>
    </form>

    <p class="auth-footnote">Already have an account? <a href="{% url 'accounts:login' %}">Login</a></p>

  </div>
</div>
</div>
{% endblock %}
