{% extends 'customers/base.html' %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
{% endblock %}

{% block content %}
  <div class="sc-page">
    <div class="auth-page waiting-page">
      <div class="sc-state-card sc-reveal">
        <div class="sc-state-icon neutral">
          <i class="bi bi-hourglass-split"></i>
        </div>

        <span class="sc-eyebrow mb-3">Pending Review</span>
        <h2 class="mb-3">Account Submitted Successfully</h2>
        <p class="sc-text-muted mb-2">Your account is currently under review by the admin.</p>
        <p class="sc-text-muted mb-4">You will be able to login once your account is approved.</p>

        <a href="{% url 'home' %}" class="sc-btn sc-btn-primary" data-ripple>Go to Home</a>
      </div>
    </div>
  </div>
{% endblock %}
