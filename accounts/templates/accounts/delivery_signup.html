{% extends 'customers/base.html' %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="sc-page">
<div class="auth-page">
  <div class="auth-card auth-card-wide sc-reveal">

    <div class="auth-icon"><i class="bi bi-truck"></i></div>
    <h1 class="auth-title">Delivery Partner Registration</h1>
    <p class="auth-subtitle">Join SmartCart's delivery network.</p>

    <form method="POST">
      {% csrf_token %}

      <div class="sc-field">
        <label class="sc-label" for="dsUsername">Username</label>
        <input type="text" id="dsUsername" name="username" class="sc-input" placeholder="Choose a username" required autofocus>
      </div>

      <div class="sc-field">
        <label class="sc-label" for="dsEmail">Email</label>
        <input type="email" id="dsEmail" name="email" class="sc-input" placeholder="you@example.com" required>
      </div>

      <div class="sc-field">
        <label class="sc-label" for="dsPassword">Password</label>
        <input type="password" id="dsPassword" name="password" class="sc-input" placeholder="Create a password" required>
      </div>

      <div class="sc-field">
        <label class="sc-label" for="dsHubName">Hub Name</label>
        <input type="text" id="dsHubName" name="hub_name" class="sc-input" placeholder="Name of your delivery hub" required>
      </div>

      <div class="checkout-form-row-2">
        <div class="sc-field">
          <label class="sc-label" for="dsHubArea">Hub Area (sqft)</label>
          <input type="number" id="dsHubArea" name="hub_area" class="sc-input" placeholder="e.g. 1200" required>
        </div>
        <div class="sc-field">
          <label class="sc-label" for="dsEmployees">Number of Employees</label>
          <input type="number" id="dsEmployees" name="employees" class="sc-input" placeholder="e.g. 5" required>
        </div>
      </div>

      <button type="submit" class="sc-btn sc-btn-primary sc-btn-block" data-ripple>Register Delivery Partner</button>
    </form>

    <div class="auth-note"><i class="bi bi-info-circle-fill"></i> Admin will review and approve your account.</div>

  </div>
</div>
</div>
{% endblock %}
